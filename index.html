<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PARABOLA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f url('https://i.ibb.co/F4ZWzqyP/mooon.webp') center / cover no-repeat fixed;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.65);
      z-index: 0;
      pointer-events: none;
    }
    .banner, .hero, .ca-section, .stats, .chart-section, .links-section, footer {
      position: relative;
      z-index: 1;
    }
    .banner {
      width: 100%;
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem 0;
    }
    .banner a {
      display: block;
      line-height: 0;
      transition: transform 0.2s, opacity 0.2s;
    }
    .banner a:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }
    .banner img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.15);
    }
    .hero {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }
    .hero h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #a78bfa, #6366f1, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-top: 1rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.7;
    }
    .ca-section {
      text-align: center;
      padding: 0 2rem 2rem;
    }
    .ca-label {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .ca-address {
      display: inline-block;
      background: #12121a;
      border: 1px solid #1e1e2a;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #a78bfa;
      word-break: break-all;
      max-width: 100%;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 0 2rem;
    }
    .stat-card {
      background: rgba(18, 18, 26, 0.8);
      border: 1px solid #1e1e2a;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .stat-label {
      font-size: 0.7rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
    }
    .stat-value {
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .stat-value.up { color: #22c55e; }
    .stat-value.down { color: #ef4444; }
    .stat-value.neutral { color: #94a3b8; }
    @media (max-width: 640px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
    }

    .chart-section {
      width: 100%;
      padding: 0 0 3rem;
    }
    .chart-section iframe {
      display: block;
      width: 100%;
      height: 720px;
      border: none;
      background: #0d0d15;
    }
    .links-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      background: #12121a;
      border: 1px solid #1e1e2a;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }
    .link-btn:hover {
      border-color: #6366f1;
      transform: translateY(-2px);
    }
    .link-btn.share {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      border: none;
    }
    .link-btn.share:hover {
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
    }
    footer {
      margin-top: auto;
      text-align: center;
      padding: 2rem;
      color: #475569;
      font-size: 0.875rem;
      border-top: 1px solid #1e1e2a;
    }
    @media (max-width: 640px) {
      .hero h1 { font-size: 2.5rem; }
      .chart-section iframe { height: 360px; }
    }
  </style>
</head>
<body>
  <section class="banner">
    <a href="https://pump.fun/coin/BXFPRH78negdDuPiC7voGZun6cm4vQfjGxBD3GzApump" target="_blank" rel="noopener">
      <img src="https://i.ibb.co/PZpZdzNH/parabolatokenbanner.gif" alt="PARABOLA Banner">
    </a>
  </section>

  <section class="stats" id="stats">
    <div class="stat-card">
      <div class="stat-label">Market Cap</div>
      <div class="stat-value neutral" id="mcap">---</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">5m Volume</div>
      <div class="stat-value neutral" id="vol5m">---</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Holders</div>
      <div class="stat-value neutral" id="holders">---</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Price 5m</div>
      <div class="stat-value neutral" id="price">---</div>
    </div>
  </section>

  <section class="hero">
    <h1>PARABOLA</h1>
    <p>A next-generation platform built for speed, scale, and simplicity. Welcome to the future.</p>
  </section>

  <section class="ca-section">
    <div class="ca-label">Contract Address</div>
    <div class="ca-address">BXFPRH78negdDuPiC7voGZun6cm4vQfjGxBD3GzApump</div>
  </section>

  <section class="chart-section">
    <iframe src="https://dexscreener.com/solana/BXFPRH78negdDuPiC7voGZun6cm4vQfjGxBD3GzApump?embed=1&theme=dark&info=0&trades=0" title="DexScreener Chart"></iframe>
  </section>

  <section class="links-section">
    <a href="https://x.com/i/communities/2038020673076093328" target="_blank" rel="noopener" class="link-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      X Community
    </a>
    <a href="https://x.com/intent/post?text=Check%20out%20the%20PARABOLA%20community%20on%20X!%20Join%20us%20here%3A%20https%3A%2F%2Fx.com%2Fi%2Fcommunities%2F2038020673076093328" target="_blank" rel="noopener" class="link-btn share">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Share on X
    </a>
  </section>

  <footer>
    &copy; 2026 PARABOLA. All rights reserved.
  </footer>

  <script>
    const CA = 'BXFPRH78negdDuPiC7voGZun6cm4vQfjGxBD3GzApump';

    function fmt(n) {
      if (n == null || isNaN(n)) return '---';
      if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
      if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
      if (n < 0.00001) return n.toExponential(2);
      if (n < 1) return n.toFixed(6);
      return n.toFixed(2);
    }

    function fmtUsd(n) {
      if (n == null || isNaN(n)) return '---';
      return '$' + fmt(n);
    }

    function setCls(el, clsName) {
      el.className = 'stat-value ' + clsName;
    }

    async function fetchDex() {
      try {
        const r = await fetch('https://api.dexscreener.com/latest/dex/tokens/' + CA);
        const d = await r.json();
        const pair = d.pairs && d.pairs.find(p => p.dexId === 'pumpfun');
        if (!pair) return;

        document.getElementById('mcap').textContent = fmtUsd(parseFloat(pair.fdv));
        document.getElementById('vol5m').textContent = fmtUsd(pair.volume && parseFloat(pair.volume.m5));

        const priceEl = document.getElementById('price');
        const price = parseFloat(pair.priceUsd);
        const pc = pair.priceChange && parseFloat(pair.priceChange.m5);
        if (!isNaN(price)) {
          const change = (!isNaN(pc)) ? ' (' + (pc >= 0 ? '+' : '') + pc.toFixed(2) + '%)' : '';
          priceEl.textContent = '$' + fmt(price) + change;
          setCls(priceEl, pc >= 0 ? 'up' : pc < 0 ? 'down' : 'neutral');
        }
      } catch (e) {
        console.error('fetchDex error', e);
      }
    }

    async function fetchHolders() {
      try {
        const r = await fetch('https://rpc.ankr.com/solana', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            jsonrpc: '2.0', id: 1,
            method: 'getTokenAccountsByMint',
            params: [
              CA,
              { programId: 'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA' },
              { encoding: 'base64', limit: 1000 }
            ]
          })
        });
        const d = await r.json();
        if (d && d.result && d.result.value) {
          document.getElementById('holders').textContent = d.result.value.length.toLocaleString();
        }
      } catch (e) {
        console.error('holders fetch error', e);
      }
    }

    fetchDex();
    fetchHolders();
    setInterval(fetchDex, 15000);
    setInterval(fetchHolders, 60000);
  </script>
</body>
</html>
