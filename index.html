    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #0a0a0f;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .banner {
      width: 100%;
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem 0;
    }
    .banner a {
      display: block;
      line-height: 0;
      transition: transform 0.2s, opacity 0.2s;
    }
    .banner a:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }
    .banner img {
      max-width: 100%;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 0 60px rgba(139, 92, 246, 0.15);
    }
    .hero {
      text-align: center;
      padding: 4rem 2rem 2rem;
    }
    .hero h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #a78bfa, #6366f1, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero p {
      font-size: 1.25rem;
      color: #94a3b8;
      margin-top: 1rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.7;
    }
    .ca-section {
      text-align: center;
      padding: 0 2rem 2rem;
    }
    .ca-label {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }
    .ca-address {
      display: inline-block;
      background: #12121a;
      border: 1px solid #1e1e2a;
      border-radius: 10px;
      padding: 0.75rem 1.5rem;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
      color: #a78bfa;
      word-break: break-all;
      max-width: 100%;
    }
    .chart-section {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem 3rem;
    }
    .chart-section iframe {
      width: 100%;
      height: 600px;
      border: 1px solid #1e1e2a;
      border-radius: 16px;
      background: #0d0d15;
    }
    .links-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem 4rem;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 2rem;
      border-radius: 12px;
      background: #12121a;
      border: 1px solid #1e1e2a;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }
    .link-btn:hover {
      border-color: #6366f1;
      transform: translateY(-2px);
    }
    .link-btn.share {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      border: none;
    }
    .link-btn.share:hover {
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.35);
    }
    footer {
      margin-top: auto;
      text-align: center;
      padding: 2rem;
      color: #475569;
      font-size: 0.875rem;
      border-top: 1px solid #1e1e2a;
    }
    @media (max-width: 640px) {
      .hero h1 { font-size: 2.5rem; }
      .chart-section iframe { height: 360px; }
    }
